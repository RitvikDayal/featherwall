name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish src/FeatherWall -c Release -o publish
          /p:PublishSingleFile=true /p:SelfContained=false /p:DebugType=embedded

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Compress-Archive -Path publish/* -DestinationPath "featherwall-$tag-win-x64.zip"
          Get-FileHash "featherwall-$tag-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  featherwall-$tag-win-x64.zip" } |
            Out-File "featherwall-$tag-win-x64.zip.sha256" -Encoding ascii

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            featherwall-*-win-x64.zip
            featherwall-*-win-x64.zip.sha256
          body: |
            Requires the [.NET 10 desktop runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
            (the build is framework-dependent, which is what keeps the download small).

            Releases are **unsigned**, so SmartScreen will warn. Verify the SHA-256 against the
            `.sha256` file, or build from source.
