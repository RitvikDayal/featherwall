name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish src/FeatherWall -c Release -o publish
          /p:PublishSingleFile=true /p:SelfContained=false /p:DebugType=embedded

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Compress-Archive -Path publish/* -DestinationPath "featherwall-$tag-win-x64.zip"
          Get-FileHash "featherwall-$tag-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  featherwall-$tag-win-x64.zip" } |
            Out-File "featherwall-$tag-win-x64.zip.sha256" -Encoding ascii

      # Per-user Setup.exe (Velopack); it installs .NET 10 first when missing, which asks for admin.
      # The fixed name lets the site link releases/latest/download/FeatherWall-Setup.exe. The id is
      # not "FeatherWall": %LOCALAPPDATA%\FeatherWall holds the log, and Velopack offers to wipe a
      # folder that isn't empty. No Velopack shortcuts: the app keeps its own Start menu entry.
      - name: Installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId FeatherWallApp --packTitle FeatherWall --packAuthors "Ritvik Dayal" `
            --packVersion $tag.TrimStart('v') --packDir publish --mainExe featherwall.exe `
            --icon src/FeatherWall/featherwall.ico --framework net10.0-x64-desktop --runtime win-x64 `
            --shortcuts "" -o velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item velopack/FeatherWallApp-win-Setup.exe FeatherWall-Setup.exe
          Get-FileHash FeatherWall-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  FeatherWall-Setup.exe" } |
            Out-File FeatherWall-Setup.exe.sha256 -Encoding ascii

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            featherwall-*-win-x64.zip
            featherwall-*-win-x64.zip.sha256
            FeatherWall-Setup.exe
            FeatherWall-Setup.exe.sha256
          body: |
            `FeatherWall-Setup.exe` installs FeatherWall for your user, and the .NET 10 desktop runtime too if it is missing. The zip needs the [.NET 10 desktop runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed already.

            Releases are **unsigned**, so SmartScreen will warn. Verify the SHA-256 against the
            `.sha256` file, or build from source.
